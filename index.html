<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Transport Card Mock</title>
    <style>
      /* Home Assistant default light theme (home-assistant/frontend) */
      :root {
        color-scheme: light;

        --primary-text-color: #141414;
        --secondary-text-color: #5e5e5e;
        --card-background-color: #ffffff;
        --ha-card-background: var(--card-background-color);
        --primary-background-color: #fafafa;
        --secondary-background-color: #e5e5e5;
        --divider-color: rgba(0, 0, 0, 0.12);
        --warning-color: #ffa600;
        --info-color: #039be5;

        --ha-space-1: 4px;
        --ha-space-2: 8px;
        --ha-space-3: 12px;

        --ha-border-radius-sm: 4px;
        --ha-border-radius-lg: 12px;

        --ha-font-family-body: Roboto, Noto, sans-serif;
        --ha-font-size-s: 12px;
      }

      /* Home Assistant default dark theme (darkColorStyles, home-assistant/frontend) */
      :root[data-theme="dark"] {
        color-scheme: dark;

        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --card-background-color: #1c1c1c;
        --primary-background-color: #111111;
        --secondary-background-color: #282828;
        --divider-color: rgba(225, 225, 225, 0.12);
      }

      body {
        margin: 0;
        padding: 24px;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        font-family: var(--ha-font-family-body);
      }

      /* Mirrors the defaults of HA's ha-card component */
      ha-card {
        display: block;
        box-sizing: border-box;
        background: var(--ha-card-background);
        border: 1px solid var(--divider-color);
        border-radius: var(--ha-border-radius-lg);
        color: var(--primary-text-color);
      }

      #card {
        display: block;
        max-width: 400px;
        margin: 0 auto;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ha-space-2);
        max-width: 400px;
        margin: 0 auto 24px;
        padding: var(--ha-space-2) var(--ha-space-3);
        background: var(--ha-card-background);
        border: 1px solid var(--divider-color);
        border-radius: var(--ha-border-radius-sm);
        box-sizing: border-box;
      }

      .controls label {
        color: var(--secondary-text-color);
        font-size: var(--ha-font-size-s);
      }

      .control {
        display: flex;
        align-items: center;
        gap: var(--ha-space-2);
      }

      .controls select {
        font: inherit;
        color: var(--primary-text-color);
        background: var(--primary-background-color);
        border: 1px solid var(--divider-color);
        border-radius: var(--ha-border-radius-sm);
        padding: var(--ha-space-1) var(--ha-space-2);
      }
    </style>
    <script type="module" src="/src/transport-card.ts"></script>
    <script type="module" src="/src/transport-card-editor.ts"></script>
  </head>
  <body>
    <div class="controls">
      <div class="control">
        <label for="locale">Locale</label>
        <select id="locale">
          <option value="en">EN</option>
          <option value="de">DE</option>
        </select>
      </div>

      <div class="control">
        <input type="checkbox" id="theme" />
        <label for="theme">Dark</label>
      </div>
    </div>

    <transport-card id="card"></transport-card>

    <script type="module">
      import { createMockStop } from "./dev/mock-data.ts";
      import "./dev/ha-stubs.ts";

      const card = document.getElementById("card");
      const localeSelect = document.getElementById("locale");
      const themeToggle = document.getElementById("theme");
      let language = "en";

      localeSelect.addEventListener("change", () => {
        language = localeSelect.value;
        update();
      });

      themeToggle.addEventListener("change", () => {
        document.documentElement.dataset.theme = themeToggle.checked
          ? "dark"
          : "light";
      });

      card.setConfig({
        type: "custom:transport-card",
        entity: "sensor.mock_station",
        max_departures: 3,
        show_traffic_infos: true,
      });

      function update() {
        card.hass = {
          states: {
            "sensor.mock_station": {
              entity_id: "sensor.mock_station",
              state: "ok",
              attributes: createMockStop(),
            },
          },
          locale: { language },
          language,
        };
      }

      update();
      setInterval(update, 60_000);
    </script>
  </body>
</html>
