[project]
name = "vienna-transport"
version = "1.1.0"
requires-python = ">=3.14.2"
description = "Vienna Public Transport Home Assistant Integration"
authors = [
    { name = "Philipp Slowak", email = "philipp.slowak@gmail.com" }
]
license = { text = "MIT" }

dependencies = [
    "homeassistant>=2026.6.4",
    "aiohttp>=3.14.3",
]

[project.optional-dependencies]
dev = [
    "aiointercept>=0.1.9",
    "freezegun>=1.5.5",
    "mypy>=2.3.1",
    "pytest-cov>=7.0.0",
    "pytest-homeassistant-custom-component>=0.13.359",
    "ruff>=0.16.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["custom_components"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = ["."]
ignore_missing_imports = true
files = ["custom_components", "tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "D",
    "E",
    "F",
    "G",
    "I",
    "LOG",
    "PT",
    "S",
    "SIM",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["custom_components.vienna_transport"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
