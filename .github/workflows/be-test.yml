name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/be-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/be-test.yml"

permissions:
  contents: read

concurrency:
  group: be-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Sync dependencies
        run: uv sync --extra dev --frozen --no-install-project

      - name: Run tests with coverage
        run: uv run pytest --cov=custom_components --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
