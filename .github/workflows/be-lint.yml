name: Backend Lint

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/be-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/be-lint.yml"

permissions:
  contents: read

concurrency:
  group: be-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Sync dependencies
        run: uv sync --extra dev --frozen --no-install-project

      - name: Ruff check
        run: uv run ruff check custom_components tests --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check --diff custom_components tests

      - name: Mypy type check
        run: uv run mypy custom_components tests
